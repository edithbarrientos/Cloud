apiVersion: v1
kind: Service
metadata:
  name: ai-deequ-custom-api-service
  namespace: ai-deequ
spec:
  type: ClusterIP
  ports:
  - name: http
    port: 8080
    targetPort: 8080
  selector:
    app: ai-deequ-custom-api
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-deequ-custom-api
  namespace: ai-deequ
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai-deequ-custom-api
  template:
    metadata:
      labels:
        app: ai-deequ-custom-api
    spec:
      containers:
      - name: custom-api
        image: ai-deequ-orchestrator-flink-stream-agent:latest
        imagePullPolicy: Never
        command: ["java", "-cp", "/opt/flink/usrlib/ai-deequ-flink-runtime.jar", "com.orchestra.ado.custom.CustomApiApp"]
        ports:
        - containerPort: 8080
          name: http
        resources:
          limits:
            cpu: "500m"
            memory: "512Mi"
          requests:
            cpu: "250m"
            memory: "256Mi"
