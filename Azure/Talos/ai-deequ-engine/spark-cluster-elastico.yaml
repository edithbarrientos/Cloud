apiVersion: apps/v1
kind: Deployment
metadata:
  name: spark-master
  namespace: ai-deequ
  labels:
    component: spark-master
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      component: spark-master
  template:
    metadata:
      labels:
        component: spark-master
    spec:
      containers:
        - name: spark-master
          image: "apache/spark:3.5.0"
          imagePullPolicy: IfNotPresent
          command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.master.Master"]
          ports:
            - containerPort: 7077
              name: cluster
            - containerPort: 8080
              name: webui
          env:
            - name: SPARK_MASTER_HOST
              value: "0.0.0.0"
            - name: SPARK_LOCAL_IP
              value: "0.0.0.0"
---
apiVersion: v1
kind: Service
metadata:
  name: spark-cluster-service
  namespace: ai-deequ
spec:
  ports:
    - port: 7077
      targetPort: 7077
      name: cluster
    - port: 8080
      targetPort: 8080
      name: webui
  selector:
    component: spark-master
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: spark-worker
  namespace: ai-deequ
  labels:
    component: spark-worker
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      component: spark-worker
  template:
    metadata:
      labels:
        component: spark-worker
    spec:
      containers:
        - name: spark-worker
          image: "apache/spark:3.5.0"
          imagePullPolicy: IfNotPresent
          command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.worker.Worker", "spark://spark-cluster-service:7077"]
          env:
            - name: SPARK_WORKER_MEMORY
              value: "1g"
            - name: SPARK_WORKER_CORES
              value: "1"
            - name: REDIS_HOST
              value: "ai-deequ-redis-master"
            - name: REDIS_PORT
              value: "6379"
            - name: PULSAR_TOPIC_QUALITY
              value: "persistent://orchestra/quality-mesh/data-quality-metrics"
