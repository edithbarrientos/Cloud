apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-deequ-gateway-api
  namespace: {{ .Release.Namespace }}
  labels:
    app: ai-deequ-gateway-api
spec:
  replicas: {{ .Values.gatewayApi.replicaCount }}
  selector:
    matchLabels:
      app: ai-deequ-gateway-api
  template:
    metadata:
      labels:
        app: ai-deequ-gateway-api
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
      containers:
        - name: gateway-api
          image: "{{ .Values.gatewayApi.image.repository }}:{{ .Values.gatewayApi.image.tag }}"
          imagePullPolicy: {{ .Values.gatewayApi.image.pullPolicy }}
          ports:
            - containerPort: 50051
              name: grpc-http2
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 10"]
          # 🚀 CORRECCIÓN: 'env' en lugar de 'environment'
          env:
            - name: JAVA_OPTS
              value: "-Xms512m -Xmx1024m -XX:+UseG1GC -XX:+ExitOnOutOfMemoryError -XX:+CrashOnOutOfMemoryError -XX:+PrintGCDetails"
            - name: PULSAR_BROKER_URL
              value: "pulsar://{{ .Release.Name }}-pulsar-proxy:6650"
            - name: REDIS_HOST
              value: "{{ .Release.Name }}-redis-master"
            - name: REDIS_PORT
              value: "6379"
            - name: REDIS_PASSWORD
              value: "{{ .Values.redis.auth.password }}"
            - name: PULSAR_TOPIC_CHAT
              value: "persistent://orchestra/quality-mesh/chat-messages-raw"
            - name: PULSAR_TOPIC_CONTRACT
              value: "persistent://orchestra/quality-mesh/data-contracts-dama"
            - name: PULSAR_TOPIC_QUALITY
              value: "persistent://orchestra/quality-mesh/data-quality-metrics"
          resources:
            limits:
              cpu: {{ .Values.gatewayApi.resources.limits.cpu | quote }}
              memory: {{ .Values.gatewayApi.resources.limits.memory | quote }}
          livenessProbe:
            tcpSocket:
              port: 50051
            initialDelaySeconds: 30
            periodSeconds: 15
          readinessProbe:
            tcpSocket:
              port: 50051
            initialDelaySeconds: 15
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: ai-deequ-gateway-api
  namespace: {{ .Release.Namespace }}
spec:
  type: ClusterIP
  ports:
    - port: 50051
      targetPort: 50051
      protocol: TCP
      name: grpc
  selector:
    app: ai-deequ-gateway-api
