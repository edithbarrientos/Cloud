syntax = "proto3";

option java_multiple_files = true;
option java_package = "com.orchestra.ado.gateway.grpc";
option java_outer_classname = "ChatGatewayProto";

package com.orchestra.ado.gateway.grpc;

service ChatIngressService {
  rpc IngestChatMessage (ChatMessageRequest) returns (ChatMessageResponse);
}

message ChatMessageRequest {
  // 1. Campos base de identificación y aislamiento
  string id = 1;
  string tenant_id = 2;
  string session_id = 3;
  
  // 2. Contenido del mensaje
  string message_payload = 4;
  int64 timestamp = 5;
  
  // 3. Métricas analíticas requeridas por DataContract (Amazon Deequ / IA)
  int32 estimated_tokens = 6;
  int32 char_count = 7;
}

message ChatMessageResponse {
  string status = 1;
  string message_id = 2;
  string diagnostics = 3;
}