# ======================================================================================================================
# CONFIGURACIÓN DEL STREAM PLANE CONTINUO (Apache Flink Engine - Módulo 3)
# ======================================================================================================================

flink {
  # Parámetros operacionales del paralelismo elástico en Colima
  default-parallelism = 1
  checkpoint-interval-ms = 10000
}

pulsar {
  # Endpoint DNS interno de Kubernetes para el proxy de Apache Pulsar
  broker-url = "pulsar://ai-deequ-engine-pulsar-proxy:6650"
  admin-url = "http://ai-deequ-engine-pulsar-proxy:8080"
  
  # Tópico maestro de escucha continua de mensajes de chat
  subscription-name = "flink-chat-ingest-sub"
  topic-chat = "persistent://orchestra/quality-mesh/chat-messages-raw"
}

ai-service {
  # Endpoint simulado para la evaluación paralela del contenido semántico
  api-url = "http://cluster.local"
  timeout-ms = 3000
  max-concurrent-requests = 20
}
