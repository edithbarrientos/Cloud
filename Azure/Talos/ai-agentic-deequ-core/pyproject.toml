[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-agentic-deequ-core"
version = "1.0.0"
description = "Microservicio de IA independiente para Gobernanza, Linaje y Calidad de Datos"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

# 🪄 LA SOLUCIÓN MAESTRA PARA PYTEST: Registra src/ como directorio raiz de paquetes para la suite
[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "strict"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning"
]
