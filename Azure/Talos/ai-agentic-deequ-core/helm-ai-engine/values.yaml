# ==============================================================================
# 🏢 AUTHOR      : EdithBG (ai-agentic-deequ-core Senior Cloud Architect)
# 🛡️ GOVERNANCE  : Master Parameter Spec for Helm Engine (CamelCase Default)
# ==============================================================================

replicaCount: 3
namespace: data-mesh-governance

image:
  repository: acrtalosregistry.azurecr.io/ai-agentic-deequ-core
  tag: v1.4.0
  pullPolicy: IfNotPresent

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
    - ALL

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  seccompProfile:
    type: RuntimeDefault

resources:
  requests:
    cpu: "250m"
    memory: "64Mi"
  limits:
    cpu: "1000m"
    memory: "128Mi"

env:
  activeCloudProvider: "azure"
  redisHost: "redis-cache-service.data-mesh-governance.svc.cluster.local"
  redisPort: "6379"

canary:
  enabled: true
  analysisInterval: "10s"
  thresholdFailures: 5
  maxWeight: 50
  stepWeight: 10
  latencyMaxMicroseconds: 50000

# 🪄 SECCIÓN DE SECRETOS OPERATIVOS REQUERIDA POR EL LINTER
secrets:
  noSqlConnectionString: "AccountEndpoint=https://azure.com;"
