apiVersion: apps/v1
kind: Deployment
metadata:
  name: nexus-internal-proxy
  namespace: nexus-mesh
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nexus-proxy
  template:
    metadata:
      labels:
        app: nexus-proxy
    spec:
      containers:
      - name: nginx
        image: docker.io/library/nginx:alpine
        ports:
        - containerPort: 80
        volumeMounts:
        - name: config-volume
          mountPath: /etc/nginx/nginx.conf
          subPath: nginx.conf
      volumes:
      - name: config-volume
        configMap:
          name: nexus-proxy-config
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: nexus-proxy-config
  namespace: nexus-mesh
data:
  nginx.conf: |
    events {
        worker_connections 1024;
    }
    http {
        server {
            listen 80;
            server_tokens off;

            # 🧠 SOLUCIÓN DEL BUG: Nginx actúa como proxy HTTP tradicional hacia FastAPI (Puerto 8501)
            location /api/chat/stream {
                proxy_pass http://dev-ui-service:8501;
                proxy_http_version 1.1;
                proxy_set_header Upgrade $http_upgrade;
                proxy_set_header Connection "upgrade";
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                
                # 🔥 CRÍTICO: Apaga los buffers para que las letras de DeepSeek fluyan en streaming real
                proxy_cache off;
                proxy_buffering off;
                proxy_read_timeout 3600s;
                proxy_send_timeout 3600s;
            }

            # Ruta raíz para cargar los archivos estáticos de la pantalla premium (v15)
            location / {
                proxy_pass http://dev-ui-web-service:80;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
            }
        }
    }
---
apiVersion: v1
kind: Service
metadata:
  name: nexus-gateway-interno
  namespace: nexus-mesh
spec:
  type: LoadBalancer # 🚀 Mapeo físico automático en tu localhost de la Mac
  ports:
  - port: 80
    targetPort: 80
    protocol: TCP
  selector:
    app: nexus-proxy
