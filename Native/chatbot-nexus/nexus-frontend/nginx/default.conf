server {
    listen 80;
    server_name localhost;
    server_tokens off;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # 🚀 VINCULACIÓN MAESTRA DIRECTA: Nginx conecta el app.js de tu navegador con la IA viva
    location /api/chat/stream {
        resolver kube-dns.kube-system.svc.cluster.local valid=5s;
        set $upstream_target http://cluster.local;
        proxy_pass $upstream_target;

        # Cabeceras estándar para transmisión de flujos webs
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        
        # 🔥 CRÍTICO: Desactivar búferes para que DeepSeek pase letra por letra sin atorarse
        proxy_cache off;
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }
}
